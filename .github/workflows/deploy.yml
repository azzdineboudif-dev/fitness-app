name: Deploy Vite site to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ⬇️ Installer pnpm
      - run: npm install -g pnpm

      # ⬇️ Installer les dépendances dans le sous-dossier
      - run: pnpm install --frozen-lockfile
        working-directory: ./fitness-app

      # ⬇️ Construire le site
      - run: pnpm build
        working-directory: ./fitness-app

      # Publier le dossier dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./fitness-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
